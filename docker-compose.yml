services:
  db:
    # database/Dockerfile = mysql:8.4 + charset UTF-8 + scripts de database/init
    build: ./database
    image: horarios-db
    container_name: horarios-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root2026}
      MYSQL_DATABASE: bd_horarios_esclavas
      # Usuario de la aplicación (equivale a database/local/00_crear_usuario.sql)
      MYSQL_USER: ${DB_USER:-app_horarios}
      MYSQL_PASSWORD: ${DB_PASSWORD:-horarios2026}
    volumes:
      # Los scripts de database/init se ejecutan SOLO la primera vez (volumen
      # vacío). Para recargarlos: docker compose down -v
      - db_data:/var/lib/mysql
    ports:
      # 3307 en tu PC para no chocar con tu MySQL local en el 3306
      - "${DB_HOST_PORT:-3307}:3306"
    healthcheck:
      # Por TCP (127.0.0.1) para que no pase "sano" durante la inicialización
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    build: .
    image: horarios-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-app_horarios}
      DB_PASSWORD: ${DB_PASSWORD:-horarios2026}
      DB_NAME: bd_horarios_esclavas
      WEB_HOST: 0.0.0.0
      WEB_PORT: 8000
      ABRIR_NAVEGADOR: "0"
    ports:
      # Interfaz gráfica: abrir http://localhost:8000
      - "${WEB_HOST_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  db_data:
